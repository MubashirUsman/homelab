---
- name: Create systemd service directory
  ansible.builtin.file:
    path: /etc/systemd/system
    state: directory
    mode: '0755'
  become: true

- name: Create systemd service files
  ansible.builtin.template:
    src: systemd.service.j2
    dest: /etc/systemd/system/{{ service.name }}.service
    mode: '0644'
  loop: "{{ systemd_services }}"
  loop_control:
    loop_var: service
  when: systemd_services | length > 0
  become: true
  notify: reload systemd

- name: Create systemd timer files
  ansible.builtin.template:
    src: systemd.timer.j2
    dest: /etc/systemd/system/{{ timer.name }}.timer
    mode: '0644'
  loop: "{{ systemd_timers }}"
  loop_control:
    loop_var: timer
  when: systemd_timers | length > 0
  become: true
  notify: reload systemd

- name: Enable and start systemd services
  ansible.builtin.systemd:
    name: "{{ service.name }}.service"
    enabled: "{{ service.enabled | default(true) }}"
    state: "{{ service.state | default('started') }}"
    daemon_reload: yes
  loop: "{{ systemd_services }}"
  loop_control:
    loop_var: service
  when: systemd_services | length > 0
  become: true

- name: Enable and start systemd timers
  ansible.builtin.systemd:
    name: "{{ timer.name }}.timer"
    enabled: "{{ timer.enabled | default(true) }}"
    state: "{{ timer.state | default('started') }}"
    daemon_reload: yes
  loop: "{{ systemd_timers }}"
  loop_control:
    loop_var: timer
  when: systemd_timers | length > 0
  become: true
